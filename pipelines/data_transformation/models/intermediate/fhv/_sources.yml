          - name: dispatching_base_num
            description: "Número de base TLC que despachó el viaje"
          - name: affiliated_base_number
            description: "Número de base TLC afiliada al vehículo"
          - name: tpep_pickup_datetime
            description: "Fecha y hora de recogida"
          - name: tpep_dropoff_datetime
            description: "Fecha y hora de llegada"
          - name: anio
            description: "Año del viaje"
          - name: mes
            description: "Mes del viaje"
