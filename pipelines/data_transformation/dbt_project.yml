name: 'data_transformation'
version: '1.0.0'

profile: 'data_transformation'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  data_transformation:
    staging:
      +materialized: table
      +file_format: parquet
    warehouse:
      fhv:
        +schema: fhv_model
      green:
        +schema: green_model
      hvfhs:
        +schema: hvfhs_model
      yellow:
        +schema: yellow_model