name: 'data_transformation'
version: '1.0.0'

profile: 'data_transformation'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  data_transformation:

    # -----------------------------------------------------------------------
    # Staging — Corre en Spark, escribe parquet en S3
    # -----------------------------------------------------------------------
    staging:
      +materialized: table
      +file_format: parquet

    # -----------------------------------------------------------------------
    # Intermediate — Corre en Postgres, construye esquema estrella
    # -----------------------------------------------------------------------
    intermediate:
      +materialized: table
      fhv:
        +schema: intermediate
        +tags:
          - fhv
          - intermediate
      hvfhs:
        +schema: intermediate
        +tags:
          - hvfhs
          - intermediate
      green:
        +schema: intermediate
        +tags:
          - green
          - intermediate
      yellow:
        +schema: intermediate
        +tags:
          - yellow
          - intermediate

    # -----------------------------------------------------------------------
    # Warehouse — Corre en Postgres, tablas finales de reporting
    # -----------------------------------------------------------------------
    warehouse:
      fhv:
        +schema: fhv_model
      green:
        +schema: green_model
      hvfhs:
        +schema: hvfhs_model
      yellow:
        +schema: yellow_model